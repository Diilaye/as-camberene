# ==========================================================================
# Apache du conteneur « web »
# ==========================================================================
# Sert le site construit et transmet à l'API ce qui lui revient. La couche TLS
# n'est pas ici : c'est l'Apache de l'hôte qui la porte, et qui transmet à ce
# conteneur sur 127.0.0.1:8080.

ServerName ascambere.sn
ServerTokens Prod
ServerSignature Off

DocumentRoot /usr/local/apache2/htdocs

# Les journaux partent sur la sortie standard : c'est `docker compose logs` qui
# les affiche, et la rotation devient l'affaire du démon.
ErrorLog  /proc/self/fd/2
CustomLog /proc/self/fd/1 combined

# --------------------------------------------------------------------------
# API et médias : transmis au conteneur de l'API
# --------------------------------------------------------------------------
# Déclarés avant le reste : mod_proxy tranche avant que la requête ne cherche
# un fichier, et /api ne tombera donc jamais sur le repli SPA.
ProxyPreserveHost On
ProxyTimeout 30

ProxyPass        /api     http://api:4100/api
ProxyPassReverse /api     http://api:4100/api

ProxyPass        /uploads http://api:4100/uploads
ProxyPassReverse /uploads http://api:4100/uploads

# Rien d'autre ne part vers l'API.
ProxyPass / !

<Directory /usr/local/apache2/htdocs>
    Require all granted
    Options -Indexes +FollowSymLinks
    AllowOverride None

    # Application à page unique : toute route inconnue rend index.html, et
    # c'est le routeur du navigateur qui décide. Sans cela, un rechargement
    # sur /admin/commandes donnerait un 404.
    FallbackResource /index.html
</Directory>

# Les fichiers de /assets/ portent une empreinte dans leur nom : un changement
# de contenu change le nom, ils peuvent donc être gardés indéfiniment.
<Directory /usr/local/apache2/htdocs/assets>
    Header set Cache-Control "public, max-age=31536000, immutable"
</Directory>

# index.html désigne la version des assets : il ne doit jamais venir d'un cache.
<Files "index.html">
    Header set Cache-Control "no-cache, must-revalidate"
</Files>

<IfModule mod_deflate.c>
    # `text/javascript` est indispensable : c'est le type qu'Apache donne aux
    # fichiers .js, et l'omettre laissait passer le bundle — le plus gros
    # fichier du site — sans compression.
    AddOutputFilterByType DEFLATE \
        text/html text/plain text/css text/javascript \
        application/javascript application/json application/xml \
        image/svg+xml
</IfModule>

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
