# ==========================================================================
# ASC Cambérène — vhost Apache de l'hôte, pile Docker
# ==========================================================================
# À déposer dans /etc/apache2/sites-available/ascambere.conf
#
# Variante du déploiement Docker : tout le site vit dans des conteneurs, et
# l'Apache de l'hôte ne fait que deux choses — porter le certificat et
# transmettre au conteneur `web` sur la boucle locale.
#
#   sudo a2enmod proxy proxy_http headers
#   sudo certbot --apache -d ascamberene.sn -d www.ascamberene.sn

<VirtualHost *:80>
    ServerName ascamberene.sn
    ServerAlias www.ascamberene.sn

    ErrorLog  ${APACHE_LOG_DIR}/ascambere-error.log
    CustomLog ${APACHE_LOG_DIR}/ascambere-access.log combined

    ProxyPreserveHost On
    ProxyTimeout 30

    # Le conteneur `web` sert le site et transmet lui-même /api et /uploads à
    # l'API : l'hôte n'a qu'une règle à connaître.
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # Sans ces deux en-têtes, l'API ne verrait que l'adresse du proxy. Elle en
    # a besoin pour sa limite de débit — voir TRUST_PROXY dans docker-compose.
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port  "80"
</VirtualHost>

# --------------------------------------------------------------------------
# Après certbot, le vhost 443 qu'il génère doit reprendre les mêmes règles.
# Y remplacer les deux en-têtes par :
#
#   RequestHeader set X-Forwarded-Proto "https"
#   RequestHeader set X-Forwarded-Port  "443"
#
# et, une fois HTTPS vérifié, activer HSTS :
#
#   Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
# --------------------------------------------------------------------------
